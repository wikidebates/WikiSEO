name: WikiSEO - PHP 8.4 smoke and compatibility checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php84:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Syntax-check extension and standalone checks
        shell: bash
        run: |
          set -euo pipefail
          find includes -name '*.php' -print0 | xargs -0 -n 1 php -l
          find tests/standalone -name '*.php' -print0 | xargs -0 -n 1 php -l
          php -r 'json_decode(file_get_contents("extension.json"), true, 512, JSON_THROW_ON_ERROR);'
      - name: Validate metadata and generator behavior
        shell: bash
        run: |
          set -euo pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/meta_values.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/generators.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/page_policy.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/image_work.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/canonical_work.php
      - name: Compare image lookup counts with the previous implementation
        shell: bash
        run: |
          set -euo pipefail
          baseline=3f52f9d7d196bcaed541201f4412f4bf1e6b71e1
          git fetch --no-tags --depth=1 origin "$baseline"
          previous="$(mktemp)"
          trap 'rm -f "$previous"' EXIT
          git show "$baseline:includes/Generator/AbstractBaseGenerator.php" > "$previous"
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/image_work.php "$previous" --baseline

      - name: Compare canonical lookup counts with previous implementation
        shell: bash
        run: |
          set -euo pipefail
          baseline=4927c1efd4493697133af80a48b73feb7afd0958
          git fetch --no-tags --depth=1 origin "$baseline"
          worktree="$RUNNER_TEMP/wikiseo-canonical-before"
          git worktree add --detach "$worktree" "$baseline"
          trap 'git worktree remove --force "$worktree"' EXIT
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/canonical_work.php "$worktree" --baseline

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wikimedia/mediawiki
          ref: 1.43.11
          path: .mw-lab
      - uses: actions/checkout@v4
        with:
          path: .mw-lab/extensions/WikiSEO
      - uses: actions/checkout@v4
        with:
          repository: wikidebates/wikidebates-core
          ref: 07cc741fd9bbe768ef182a1c123f8c634d4a82f8
          path: .wd-lab
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer
      - name: Install isolated MediaWiki dependencies
        working-directory: .mw-lab
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify native handoff and ordinary SEO output
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
          WD_TEST_EXTENSIONS: WikiSEO
        run: php -d display_errors=1 -d error_reporting=E_ALL .wd-lab/tests/seoCoexistence.php
      - name: Canonical precedence with a real MediaWiki page
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
          WD_TEST_EXTENSIONS: WikiSEO
          WD_SEO_LAB_BOOTSTRAP: ${{ github.workspace }}/.wd-lab/tests/mediawikiEnvironment.php
        run: php -d display_errors=1 -d error_reporting=E_ALL .mw-lab/extensions/WikiSEO/tests/integration/canonical.php

