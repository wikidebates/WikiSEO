name: WikiSEO - PHP 8.4 smoke and compatibility checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php84:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Syntax-check extension and standalone checks
        shell: bash
        run: |
          set -euo pipefail
          find includes -name '*.php' -print0 | xargs -0 -n 1 php -l
          find tests/standalone -name '*.php' -print0 | xargs -0 -n 1 php -l
          php -r 'json_decode(file_get_contents("extension.json"), true, 512, JSON_THROW_ON_ERROR);'
      - name: Validate metadata and generator behavior
        shell: bash
        run: |
          set -euo pipefail
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/meta_values.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/generators.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/page_policy.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/image_work.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/canonical_work.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/parser_work.php
      - name: Compare image lookup counts with the previous implementation
        shell: bash
        run: |
          set -euo pipefail
          baseline=3f52f9d7d196bcaed541201f4412f4bf1e6b71e1
          git fetch --no-tags --depth=1 origin "$baseline"
          previous="$(mktemp)"
          trap 'rm -f "$previous"' EXIT
          git show "$baseline:includes/Generator/AbstractBaseGenerator.php" > "$previous"
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/image_work.php "$previous" --baseline

      - name: Compare canonical lookup counts with previous implementation
        shell: bash
        run: |
          set -euo pipefail
          baseline=4927c1efd4493697133af80a48b73feb7afd0958
          git fetch --no-tags --depth=1 origin "$baseline"
          worktree="$RUNNER_TEMP/wikiseo-canonical-before"
          git worktree add --detach "$worktree" "$baseline"
          trap 'git worktree remove --force "$worktree"' EXIT
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/canonical_work.php "$worktree" --baseline

      - name: Compare parser, validator and X image work with previous implementation
        shell: bash
        run: |
          set -euo pipefail
          baseline=22cc1b7f65d1bd058b7178393dbb17d3c015063f
          git fetch --no-tags --depth=1 origin "$baseline"
          worktree="$RUNNER_TEMP/wikiseo-parser-before"
          git worktree add --detach "$worktree" "$baseline"
          trap 'git worktree remove --force "$worktree"' EXIT
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/parser_work.php "$worktree" --baseline
          php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/generators.php "$worktree" --baseline

      - name: Compare shared image resolution and exact output with previous implementation
        shell: bash
        run: |
          set -euo pipefail
          baseline=ebc7e662c316a2000cf435b8cea94a39b3ebd893
          git fetch --no-tags --depth=1 origin "$baseline"
          worktree="$RUNNER_TEMP/wikiseo-image-before"
          git worktree add --detach "$worktree" "$baseline"
          trap 'git worktree remove --force "$worktree"' EXIT
          before="$(php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/shared_images.php "$worktree" --baseline)"
          after="$(php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/shared_images.php)"
          printf '%s\n%s\n' "$before" "$after"
          python3 - "$before" "$after" <<'PY'
          import json, sys
          before, after = [json.loads(line.removeprefix("WD_SHARED_IMAGE_WORK ")) for line in sys.argv[1:]]
          assert before["html_sha256"] == after["html_sha256"], "Metadata output changed"
          PY

      - name: Compare global metadata and text decoding with previous implementation
        shell: bash
        run: |
          set -euo pipefail
          baseline=0e9d121e6ba25a42e771d818a3a3841fa468a3fd
          git fetch --no-tags --depth=1 origin "$baseline"
          worktree="$RUNNER_TEMP/wikiseo-global-before"
          git worktree add --detach "$worktree" "$baseline"
          trap 'git worktree remove --force "$worktree"' EXIT
          before="$(php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/global_work.php "$worktree" --baseline)"
          after="$(php -d display_errors=1 -d error_reporting=E_ALL tests/standalone/global_work.php)"
          printf '%s\n%s\n' "$before" "$after"
          python3 - "$before" "$after" <<'PY'
          import json, sys
          before, after = [json.loads(line.removeprefix("WD_GLOBAL_WORK ")) for line in sys.argv[1:]]
          assert before["output_sha256"] == after["output_sha256"], "Metadata or decoding changed"
          PY

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wikimedia/mediawiki
          ref: 1.43.12
          path: .mw-lab
      - uses: actions/checkout@v4
        with:
          path: .mw-lab/extensions/WikiSEO
      - uses: actions/checkout@v4
        with:
          repository: wikidebates/wikidebates-core
          ref: 21d0c0d27ac72b9392d859d695c56230a868d772
          path: .wd-lab
      - uses: actions/checkout@v4
        with:
          repository: StarCitizenTools/mediawiki-extensions-ShortDescription
          ref: 683dde18ac00fcfebde0fbfb59fe1552c171386c
          path: .mw-lab/extensions/ShortDescription
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer
      - name: Install isolated MediaWiki dependencies
        working-directory: .mw-lab
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify native handoff and ordinary SEO output
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
          WD_TEST_EXTENSIONS: WikiSEO
        run: php -d display_errors=1 -d error_reporting=E_ALL .wd-lab/tests/seoCoexistence.php
      - name: Canonical precedence with a real MediaWiki page
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
          WD_TEST_EXTENSIONS: WikiSEO
          WD_SEO_LAB_BOOTSTRAP: ${{ github.workspace }}/.wd-lab/tests/mediawikiEnvironment.php
        run: |
          php -d display_errors=1 -d error_reporting=E_ALL .mw-lab/extensions/WikiSEO/tests/integration/canonical.php
          php -d display_errors=1 -d error_reporting=E_ALL .mw-lab/extensions/WikiSEO/tests/integration/parser.php
          php -d display_errors=1 -d error_reporting=E_ALL .mw-lab/extensions/WikiSEO/tests/integration/website.php
          php -d display_errors=1 -d error_reporting=E_ALL .mw-lab/extensions/WikiSEO/tests/integration/robots.php
      - name: Reuse ShortDescription on French and English ordinary pages
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
          WD_TEST_EXTENSIONS: WikiSEO,ShortDescription
          WD_SEO_LAB_BOOTSTRAP: ${{ github.workspace }}/.wd-lab/tests/mediawikiEnvironment.php
        run: |
          for lang in fr en; do
            WD_TEST_LANGUAGE="$lang" php -d display_errors=1 -d error_reporting=E_ALL .mw-lab/extensions/WikiSEO/tests/integration/short_description.php
          done
